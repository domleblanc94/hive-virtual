name: Validate

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p test_hive_virtual.py
      - run: node --check custom_components/hive_virtual/frontend/panel.js
      - name: Check release tag matches manifest
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('custom_components/hive_virtual/manifest.json').read_text())['version']
          assert os.environ['RELEASE_TAG'].removeprefix('v') == version
          PY
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
